[package]
name = "elfrust"
version = "0.1.0"
edition = "2024"
description = "Toy ELF file inspector in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
bitflags = { version = "2.13.2", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
clap = { version = "4.6.9", features = ["derive"] }
pager = "0.16.1"
static_assertions = "1.1.0"
strum_macros = "0.27.2"
tabled = "0.20.0"

[dev-dependencies]
snapbox = "1.2.2"
